<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>پنل خبری ایتا</title>

<style>
body{
margin:0;
font-family:Tahoma,Arial;
background:#f3f5f7;
color:#222;
}

header{
background:#168aad;
color:white;
padding:25px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:15px;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:10px;
background:#168aad;
color:white;
font-size:16px;
}
</style>

</head>

<body>

<header>
<h2>پنل خبری ایتا</h2>
<p>مدیریت منابع و اخبار</p>
</header>

<div class="container">

<div class="card">

<h3>منابع خبری</h3>

<button onclick="openSources()">
ورود به منابع خبری
</button>

</div>

<div id="sources" class="card" style="display:none">

<h3>افزودن منبع خبری</h3>

<input
id="name"
placeholder="نام کانال"
style="width:100%;padding:12px;margin-bottom:10px"
>

<input
id="link"
placeholder="@channel"
style="width:100%;padding:12px;margin-bottom:10px"
>

<button onclick="addSource()">
افزودن
</button>

<div id="list"></div>

</div>

</div>

<script>

function openSources(){

document.getElementById("sources").style.display="block";

}

function addSource(){

let name=document.getElementById("name").value;

let link=document.getElementById("link").value;

if(name==="" || link===""){

alert("نام و شناسه کانال را وارد کن");

return;

}

let item=document.createElement("p");

item.innerHTML="📰 "+name+" — "+link;

document.getElementById("list").appendChild(item);

document.getElementById("name").value="";

document.getElementById("link").value="";

}

</script>

</body>
</html>
