<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل خبری ایتا</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .header {
      background: #168aad;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #168aad;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h2>پنل خبری ایتا</h2>
    <p>مدیریت اخبار کانال</p>
  </div>

  <div class="container">

    <div class="card">
      <h3>اخبار دریافتی</h3>
      <p>فعلاً خبری دریافت نشده است.</p>
    </div>

    <div class="card">
      <h3>منابع خبری</h3>
      <p>مدیریت کانال‌های منبع</p>
      <button>مدیریت منابع</button>
    </div>

  </div>

</body>
  </html>
